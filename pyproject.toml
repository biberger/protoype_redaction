[project]
name = "legalner"
version = "0.1.0"
description = "Data pipeline and training for a multilingual legal NER / redaction model (GLiNER2.5)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["huggingface_hub", "pyarrow"]
train = ["gliner2", "torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["legalner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
